    <h1>Contact</h1>

    <form
        action="mailto:rchintalapati@ucsd.edu"
        method="POST"
        enctype="text/plain"
    >
        <label>
            Email
            <input
                name="email"
                type="email"
                value="visitor@example.com"
            >
        </label>

        <label>
            Subject
            <input
                name="subject"
                value="Hello from your website"
            >
        </label>

        <label>
            Message
            <textarea name="body" rows="6" cols="40">I found your website and wanted to get in touch.</textarea>
        </label>

        <button>Send message</button>
    </form>
