<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Rishil Chintalapati</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="projects.js"></script>
</head>
<body>
    <h1 class="projects-title">Projects</h1>
    <p>Course visualizations and projects in machine learning and data science. Select a title to view the project.</p>
    <section class="project-overview" aria-labelledby="projects-by-year-title">
        <h2 id="projects-by-year-title">Projects by year</h2>
        <p id="chart-help">Select a slice or legend entry to filter by year. Select it again to remove the filter.</p>
        <div class="projects-chart">
            <svg id="projects-pie-plot" viewBox="-50 -50 100 100" aria-label="Projects by year" aria-describedby="chart-help" hidden></svg>
            <ul class="legend" aria-label="Project years"></ul>
        </div>
        <p id="chart-message" role="status">Loading year chart…</p>
    </section>
    <div class="project-filters">
        <label for="project-search">Search projects</label>
        <input id="project-search" class="searchBar" type="search" placeholder="Search titles, descriptions, or years…" disabled>
        <button id="clear-year" type="button" hidden>Clear year filter</button>
    </div>
    <p id="filter-status" role="status"></p>
    <div class="projects" aria-live="polite">
        <p>Loading projects…</p>
    </div>
    <noscript>Enable JavaScript to load the projects.</noscript>
</body>
</html>
